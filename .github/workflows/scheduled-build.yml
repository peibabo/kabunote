name: Scheduled Build (Blog Publish)

on:
  schedule:
    # 毎日 JST 6:00（UTC 21:00 前日）に実行
    - cron: '0 21 * * *'
  workflow_dispatch: # 手動実行も可能

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        run: |
          curl -s -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
          echo "Deploy triggered at $(date -u '+%Y-%m-%d %H:%M UTC')"
