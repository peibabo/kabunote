name: Update stocks CSV
on:
  schedule:
    - cron: '0 1 * * *' # UTC 1:00 (JST 10:00)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/update-stocks-csv.mjs
      - name: Commit & push if changed
        run: |
          git diff --quiet public/data/stocks.csv && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/stocks.csv
          git commit -m "chore: update stocks.csv from JPX data"
          git push
